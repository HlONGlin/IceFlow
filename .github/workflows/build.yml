name: Build IceFlow

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust tests
        working-directory: rust-core
        run: cargo test

      - name: Build Rust core
        run: |
          cargo install cargo-ndk --locked
          bash rust-core/build-android.sh

      - name: Remove Rust build intermediates
        run: |
          rm -rf rust-core/target
          df -h /

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray-wrapper/go.mod
          cache-dependency-path: xray-wrapper/go.sum

      - name: Go tests
        working-directory: xray-wrapper
        run: go test ./...

      - name: Build mihomo AAR
        run: bash mihomo-wrapper/build-aar.sh

      - name: Build xray-core AAR
        run: bash xray-wrapper/build-aar.sh

      - name: Free Go build cache before Android builds
        run: |
          go clean -cache
          df -h /

      - name: Resolve app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^iceflow.versionName=//p' gradle.properties | head -n 1)"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported app version: $version"
            exit 1
          fi
          version_code="$(sed -n 's/^iceflow.versionCode=//p' gradle.properties | head -n 1)"
          if [[ ! "$version_code" =~ ^[0-9]+$ ]]; then
            echo "Invalid iceflow.versionCode in gradle.properties: $version_code"
            exit 1
          fi
          echo "ICEFLOW_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ICEFLOW_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Dual unit tests
        run: ./gradlew testDualDebugUnitTest lintDualDebug

      - name: Single unit tests
        run: ./gradlew testSingleDebugUnitTest lintSingleDebug

      - name: Build debug APKs
        run: ./gradlew assembleDualDebug assembleSingleDebug assembleDualDebugAndroidTest

      - name: Build release APKs
        run: ./gradlew assembleDualRelease assembleSingleRelease -Piceflow.versionName="$ICEFLOW_VERSION_NAME" -Piceflow.versionCode="$ICEFLOW_VERSION_CODE"

      - name: Rename release APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p app/build/outputs/apk/release

          for flavor in dual single; do
            sources=(app/build/outputs/apk/${flavor}/release/*.apk)
            if [[ "${#sources[@]}" -ne 4 ]]; then
              echo "Expected four ${flavor} release APKs, found ${#sources[@]}"
              exit 1
            fi
            for source in "${sources[@]}"; do
              case "$source" in
                *arm64-v8a*) abi=arm64-v8a ;;
                *armeabi-v7a*) abi=armeabi-v7a ;;
                *x86_64*) abi=x86_64 ;;
                *universal*) abi=universal ;;
                *) echo "Cannot determine ABI from $source"; exit 1 ;;
              esac
              target="app/build/outputs/apk/release/IceFlow-${ICEFLOW_VERSION_NAME}-${flavor}-${abi}-release.apk"
              mv "$source" "$target"
            done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-debug
          path: app/build/outputs/apk/*/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-release
          path: app/build/outputs/apk/release/IceFlow-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-instrumentation
          if-no-files-found: error
          path: |
            app/build/outputs/apk/dual/debug/app-dual-x86_64-debug.apk
            app/build/outputs/apk/androidTest/dual/debug/app-dual-debug-androidTest.apk

  integration:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4

      - uses: actions/download-artifact@v4
        with:
          name: iceflow-instrumentation
          path: integration-apks

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          adb start-server

      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          ram-size: 2048M
          script: bash scripts/run-android-instrumentation.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-reports
          path: integration-results/

  publish:
    needs: [build, integration]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iceflow-release
          path: release-apks

      # Local signed releases are authoritative; CI must not replace their APKs.
      - name: Check for an existing release
        id: existing-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$(gh api --paginate repos/"$GH_REPO"/releases --jq '.[].tag_name')"
          if printf '%s\n' "$releases" | grep -Fxq "$GITHUB_REF_NAME"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists; keeping its signed assets and release notes."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.existing-release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-apks/IceFlow-*.apk
