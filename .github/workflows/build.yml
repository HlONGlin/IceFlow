name: Build IceFlow

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust tests
        working-directory: rust-core
        run: cargo test

      - name: Build Rust core
        run: |
          cargo install cargo-ndk --locked
          bash rust-core/build-android.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray-wrapper/go.mod
          cache-dependency-path: xray-wrapper/go.sum

      - name: Go tests
        working-directory: xray-wrapper
        run: go test ./...

      - name: Build xray-core AAR
        run: bash xray-wrapper/build-aar.sh

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-debug
          path: app/build/outputs/apk/debug/*.apk
