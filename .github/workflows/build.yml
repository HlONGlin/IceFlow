name: Build IceFlow

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust tests
        working-directory: rust-core
        run: cargo test

      - name: Build Rust core
        run: |
          cargo install cargo-ndk --locked
          bash rust-core/build-android.sh

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray-wrapper/go.mod
          cache-dependency-path: xray-wrapper/go.sum

      - name: Go tests
        working-directory: xray-wrapper
        run: go test ./...

      - name: Build xray-core AAR
        run: bash xray-wrapper/build-aar.sh

      - name: Resolve app version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.4.1"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Unsupported app version: $version"
            exit 1
          fi
          IFS=. read -r major minor patch revision <<< "$version"
          revision="${revision:-0}"
          echo "ICEFLOW_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "ICEFLOW_VERSION_CODE=$((major * 1000000 + minor * 10000 + patch * 100 + revision))" >> "$GITHUB_ENV"

      - name: Dual unit tests
        run: ./gradlew testDualDebugUnitTest lintDualDebug

      - name: Single unit tests
        run: ./gradlew testSingleDebugUnitTest lintSingleDebug

      - name: Build debug APKs
        run: ./gradlew assembleDualDebug assembleSingleDebug

      - name: Build release APKs
        run: ./gradlew assembleDualRelease assembleSingleRelease -Piceflow.versionName="$ICEFLOW_VERSION_NAME" -Piceflow.versionCode="$ICEFLOW_VERSION_CODE"

      - name: Rename release APKs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p app/build/outputs/apk/release

          for flavor in dual single; do
            sources=(app/build/outputs/apk/${flavor}/release/*.apk)
            if [[ "${#sources[@]}" -ne 4 ]]; then
              echo "Expected four ${flavor} release APKs, found ${#sources[@]}"
              exit 1
            fi
            for source in "${sources[@]}"; do
              case "$source" in
                *arm64-v8a*) abi=arm64-v8a ;;
                *armeabi-v7a*) abi=armeabi-v7a ;;
                *x86_64*) abi=x86_64 ;;
                *universal*) abi=universal ;;
                *) echo "Cannot determine ABI from $source"; exit 1 ;;
              esac
              target="app/build/outputs/apk/release/IceFlow-${ICEFLOW_VERSION_NAME}-${flavor}-${abi}-release.apk"
              mv "$source" "$target"
            done
          done

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDualDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.networkToggle=true

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-debug
          path: app/build/outputs/apk/*/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/

      - uses: actions/upload-artifact@v4
        with:
          name: iceflow-release
          path: app/build/outputs/apk/release/IceFlow-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/IceFlow-*.apk
