[package]
name = "iceflow_core"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
# cdylib 供 Android 加载；rlib 便于在主机上跑单元测试
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
log = "0.4"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tun = { version = "=0.8.14", features = ["async"] }
tun2proxy = { version = "=0.8.6", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
